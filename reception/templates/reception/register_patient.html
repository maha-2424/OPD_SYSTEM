<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reception | Register Patient</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                linear-gradient(
                    rgba(8, 30, 40, 0.85),
                    rgba(8, 30, 40, 0.92)
                ),
                url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d")
                center/cover no-repeat;

            color: white;
        }

        .card {
            width: 480px;
            padding: 35px;

            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 24px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid rgba(255,255,255,0.3);

            border-radius: 12px;

            background: rgba(255,255,255,0.12);

            color: white;

            outline: none;
        }

        select option {
            color: black;
        }

        .emergency {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .emergency input {
            width: auto;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: white;

            color: #12343b;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🏥 Register Patient</h1>

    <p class="subtitle">
        Receptionist • OPD Token Registration
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="group">

            <label>Patient Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter patient name"
                required
            >

        </div>

        <div class="group">

            <label>Phone Number</label>

            <input
                type="tel"
                name="phone"
                maxlength="15"
                placeholder="Enter patient phone number"
                required
            >

        </div>

        <div class="group">

            <label>Age</label>

            <input
                type="number"
                name="age"
                min="1"
                required
            >

        </div>

        <div class="group">

            <label>Gender</label>

            <select name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>

        <div class="group">

            <label>Select Doctor</label>

            <select name="doctor" required>

                <option value="">
                    Select Doctor
                </option>

                {% for doctor in doctors %}

                    <option value="{{ doctor.id }}">

                        Dr. {{ doctor.name }}
                        -
                        {{ doctor.specialization }}

                    </option>

                {% empty %}

                    <option value="">
                        No doctors available
                    </option>

                {% endfor %}

            </select>

        </div>

        <div class="emergency">

            <input
                type="checkbox"
                name="is_emergency"
                id="emergency"
            >

            <label for="emergency">
                🚨 Emergency Patient
            </label>

        </div>

        <button type="submit">
            Generate OPD Token
        </button>

    </form>

</div>

</body>

</html>
