<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Login | OPD Care</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(5, 25, 35, 0.70),
                    rgba(5, 25, 35, 0.82)
                ),
                url("https://images.unsplash.com/photo-1559839734-2b71ea197ec2")
                center/cover no-repeat;
        }

        .login-card {

            width: 420px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.13);

            border: 1px solid rgba(255, 255, 255, 0.30);

            border-radius: 25px;

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45);

            color: white;
        }

        .logo {

            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.18);

            font-size: 32px;
        }

        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: rgba(255, 255, 255, 0.70);

            font-size: 14px;

            margin-bottom: 28px;
        }

        .message {

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 10px;

            background: rgba(255, 70, 70, 0.18);

            border: 1px solid rgba(255, 100, 100, 0.35);

            color: #ffb3b3;

            font-size: 13px;
        }

        .input-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            margin-left: 5px;

            font-size: 13px;
        }

        input {

            width: 100%;

            padding: 14px 17px;

            border: 1px solid rgba(255, 255, 255, 0.30);

            border-radius: 30px;

            outline: none;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 14px;
        }

        input::placeholder {

            color: rgba(255, 255, 255, 0.60);
        }

        input:focus {

            border-color: white;

            background: rgba(255, 255, 255, 0.18);
        }

        .login-btn {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 30px;

            background: white;

            color: #12343b;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.30);
        }

        .register-link {

            text-align: center;

            margin-top: 22px;

            color: rgba(255, 255, 255, 0.70);

            font-size: 13px;
        }

        .register-link a {

            color: white;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="logo">
        👨‍⚕️
    </div>


    <h1>
        Doctor Login
    </h1>


    <p class="subtitle">
        Sign in to access your OPD dashboard
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="input-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>


    </form>


    <div class="register-link">

        Don't have a doctor account?

        <a href="{% url 'doctor_registration' %}">
            Register
        </a>

    </div>


</div>


</body>

</html>
