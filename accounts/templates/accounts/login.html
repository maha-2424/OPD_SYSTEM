<!DOCTYPE html>
<html>
<head>

    <title>Login - OPD Management</title>

</head>

<body>

    <h1>Login</h1>

    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <input
            type="hidden"
            name="next"
            value="{{ request.GET.next }}"
        >


        <label>Username</label>
        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Password</label>
        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{% url 'signup' %}?next={{ request.GET.next }}">
            Sign Up
        </a>
    </p>


    <p>
        <a href="{% url 'home' %}">
            ← Back to Home
        </a>
    </p>

</body>
</html>
